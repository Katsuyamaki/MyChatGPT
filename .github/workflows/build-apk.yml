name: MyChatGPT Android APK

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "experiment/**"
      - "diagnostic/**"
      - "release/**"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mychatgpt-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle wrapper execute permission
        run: chmod +x ./gradlew

      - name: Restore MyChatGPT dev keystore
        shell: bash
        env:
          MYCHATGPT_DEV_KEYSTORE_B64: ${{ secrets.MYCHATGPT_DEV_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          : "${MYCHATGPT_DEV_KEYSTORE_B64:?missing MYCHATGPT_DEV_KEYSTORE_B64}"
          printf '%s' "$MYCHATGPT_DEV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mychatgpt-dev.jks"
          chmod 600 "$RUNNER_TEMP/mychatgpt-dev.jks"

      - name: Build debug APK
        shell: bash
        env:
          MYCHATGPT_DEV_KEYSTORE_PATH: ${{ runner.temp }}/mychatgpt-dev.jks
          MYCHATGPT_DEV_KEYSTORE_PASSWORD: ${{ secrets.MYCHATGPT_DEV_KEYSTORE_PASSWORD }}
          MYCHATGPT_DEV_KEY_ALIAS: ${{ secrets.MYCHATGPT_DEV_KEY_ALIAS }}
          MYCHATGPT_DEV_KEY_PASSWORD: ${{ secrets.MYCHATGPT_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MYCHATGPT_DEV_KEYSTORE_PASSWORD:?missing MYCHATGPT_DEV_KEYSTORE_PASSWORD}"
          : "${MYCHATGPT_DEV_KEY_ALIAS:?missing MYCHATGPT_DEV_KEY_ALIAS}"
          : "${MYCHATGPT_DEV_KEY_PASSWORD:?missing MYCHATGPT_DEV_KEY_PASSWORD}"
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$source_apk"
          mkdir -p "$RUNNER_TEMP/mychatgpt-artifacts"
          cp "$source_apk" "$RUNNER_TEMP/mychatgpt-artifacts/MyChatGPT-dev-debug.apk"
          ls -lh "$RUNNER_TEMP/mychatgpt-artifacts/MyChatGPT-dev-debug.apk"
          sha256sum "$RUNNER_TEMP/mychatgpt-artifacts/MyChatGPT-dev-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MyChatGPT-dev-debug
          path: ${{ runner.temp }}/mychatgpt-artifacts/MyChatGPT-dev-debug.apk
          if-no-files-found: error
          retention-days: 7
