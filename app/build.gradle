apply plugin: 'com.android.application'

def myChatGPTDevKeystorePath = System.getenv("MYCHATGPT_DEV_KEYSTORE_PATH") ?: rootProject.findProperty("MYCHATGPT_DEV_KEYSTORE_PATH")
def myChatGPTDevKeystorePassword = System.getenv("MYCHATGPT_DEV_KEYSTORE_PASSWORD") ?: rootProject.findProperty("MYCHATGPT_DEV_KEYSTORE_PASSWORD")
def myChatGPTDevKeyAlias = System.getenv("MYCHATGPT_DEV_KEY_ALIAS") ?: rootProject.findProperty("MYCHATGPT_DEV_KEY_ALIAS")
def myChatGPTDevKeyPassword = System.getenv("MYCHATGPT_DEV_KEY_PASSWORD") ?: rootProject.findProperty("MYCHATGPT_DEV_KEY_PASSWORD")

android {
    namespace 'com.katsuyamaki.mychatgpt'
    compileSdk 34

    defaultConfig {
        applicationId "com.katsuyamaki.mychatgpt"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        // AGP 8+ disables BuildConfig generation by default. We need it for
        // BuildConfig.APPLICATION_ID in Hooker.java and BuildConfig.DEBUG in
        // MainActivity.java.
    }

    buildFeatures {
        buildConfig true
    }

    // Signing config reads from env vars or ~/.gradle/gradle.properties.
    // The keystore is NEVER committed to the repo. For local builds, put the
    // following in ~/.gradle/gradle.properties (NOT the project's gradle.properties):
    //   MYCHATGPT_RELEASE_KEYSTORE=/absolute/path/to/mychatgpt-release.keystore
    //   MYCHATGPT_RELEASE_KEYSTORE_PASSWORD=<password>
    //   MYCHATGPT_RELEASE_KEY_ALIAS=webgpt
    //   MYCHATGPT_RELEASE_KEY_PASSWORD=<password>
    // For CI builds (e.g. GitHub Actions), set the same env vars from secrets.
    signingConfigs {
        release {
            storeFile file(System.getenv("MYCHATGPT_RELEASE_KEYSTORE") ?: (rootProject.findProperty("MYCHATGPT_RELEASE_KEYSTORE") ?: "no-keystore.p12"))
            storePassword System.getenv("MYCHATGPT_RELEASE_KEYSTORE_PASSWORD") ?: (rootProject.findProperty("MYCHATGPT_RELEASE_KEYSTORE_PASSWORD") ?: "")
            keyAlias System.getenv("MYCHATGPT_RELEASE_KEY_ALIAS") ?: (rootProject.findProperty("MYCHATGPT_RELEASE_KEY_ALIAS") ?: "")
            keyPassword System.getenv("MYCHATGPT_RELEASE_KEY_PASSWORD") ?: (rootProject.findProperty("MYCHATGPT_RELEASE_KEY_PASSWORD") ?: "")
        }

        if (myChatGPTDevKeystorePath
                && myChatGPTDevKeystorePassword
                && myChatGPTDevKeyAlias
                && myChatGPTDevKeyPassword) {
            mychatgptDev {
                storeFile file(myChatGPTDevKeystorePath)
                storePassword myChatGPTDevKeystorePassword
                keyAlias myChatGPTDevKeyAlias
                keyPassword myChatGPTDevKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            buildConfigField "boolean", "EXPERIMENTAL", "false"
        }
        debug {
            if (signingConfigs.findByName("mychatgptDev") != null) {
                signingConfig signingConfigs.mychatgptDev
            }
            // v6.24.31: debuggable=false — a debuggable APK is JIT-only and
            // never AOT-compiled, which slowed the whole UI thread in every
            // experimental so far (part of the "slower than Chrome"
            // report). This keeps the debug KEY (installs over previous
            // experimentals) while letting ART compile the app properly.
            // Consequence: BuildConfig.DEBUG becomes false, so debug-only
            // behaviors (chrome://inspect, console mirroring) are keyed on
            // BuildConfig.EXPERIMENTAL instead.
            debuggable false
            buildConfigField "boolean", "EXPERIMENTAL", "true"
        }
    }

    // AGP 8+ adds a "Dependency metadata" block to the APK signing block.
    // F-Droid's scanner rejects this as an unknown extra signing block.
    // Disable it so the APK can pass F-Droid's binary scan.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // Material Components for Android — gives us MaterialCardView, MaterialSwitch,
    // MaterialButton, the Material3 theme and the Material3 LinearProgressIndicator
    // (page-progress bar). 1.12.0 is required for the current M3 progress-indicator
    // spec: rounded track ends + gap + stop indicator are style defaults there
    // (1.11.0 still drew square ends and no stop indicator).
    implementation 'com.google.android.material:material:1.12.0'

    // ─── WebView switcher dependencies ────────────────────────────────────
    // RecyclerView: lists in the WebView Manager picker dialog.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // core-splashscreen: controls the Android 12+ system splash screen.
    // Without it the OEM default exit animation plays on launch (on some
    // devices the icon visibly expands to fullscreen before the app fades
    // in). The library + an explicit exit listener replaces that with a
    // plain crossfade of the splash into the app's loading screen on
    // every device. Pre-Android 12 behavior is unchanged.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // androidx.webkit: gives us WebViewFeature.isFeatureSupported() which we
    // use to detect whether the current WebView is new enough.
    implementation 'androidx.webkit:webkit:1.10.0'
}
